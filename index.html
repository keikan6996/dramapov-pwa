<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/dramapov-pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DramaPOV · NightChat — Interactive Chat-Drama Stories in 9 Languages.">

  <!-- Full-bleed iPhone Notch / Dynamic Island & Home Indicator support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">

  <!-- iOS Standalone Fullscreen PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DramaPOV">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>DramaPOV — NightChat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090B;
      color: #FAFAFA;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #2A0815 0%, #09090B 70%);
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #E11D48 0%, #881337 100%);
      box-shadow: 0 12px 32px rgba(225, 29, 72, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      font-size: 32px;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3.5px;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .loader {
      width: 36px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
      position: relative;
    }
    .loader::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 50%;
      background: #E11D48;
      border-radius: 99px;
      animation: slide 1s infinite ease-in-out;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-badge">💬</div>
    <div class="brand">NIGHTCHAT</div>
    <div class="loader"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 380);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=1795701754" async></script>
</body>
</html>
